* { box-sizing: border-box; }
html { font-size: clamp(10px, 1.111vw, 26px); }
html, body { margin: 0; min-height: 100%; }

body {
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: var(--font);
  background: #e6f2ff var(--img-bg) center / cover no-repeat fixed;
  display: flex;
  flex-direction: column;
  align-items: center;
}
body::after {            /* ลายเส้นฟ้า + แถบเหลี่ยมเทาด้านล่าง */
  content: "";
  position: fixed; left: 0; right: 0; bottom: 0;
  height: 34vh;
  background: var(--img-header) left bottom / cover no-repeat;
  opacity: .8;
  -webkit-mask-image: linear-gradient(to top, #000 40%, transparent);
  mask-image: linear-gradient(to top, #000 40%, transparent);
  pointer-events: none;
  z-index: 0;
}

/* ---------- ส่วนหัว ---------- */
.header { position: relative; z-index: 1; width: 100%; padding: 5.5rem 1rem 0; text-align: center; }
.title {
  margin: 0;
  color: var(--navy);
  font-size: 3rem; font-weight: 700; line-height: 1.25;
  text-shadow: 2px 3px 3px rgba(0,0,0,.22);
}
.title span { color: #1f4fd8; }
.faculty { margin: .25rem 0 0; color: var(--blue); font-size: 2.25rem; font-weight: 700; line-height: 1.25; }

.login-pill {
  position: absolute; top: 2.5rem; right: 3rem;
  display: flex; align-items: center; gap: .9rem;
  padding: .35rem 1.6rem .35rem .35rem;
  border-radius: 999px;
  background: rgba(255,255,255,.92);
  color: var(--navy);
  font: 700 2rem var(--font);
  text-decoration: none;
  box-shadow: 2px 3px 6px rgba(0,0,0,.35);
}
.login-pill .logo { flex: none; width: 4.2rem; height: 4.2rem; border-radius: 50%; background: var(--img-logo) center / cover; }

/* ---------- การ์ด ---------- */
main { position: relative; z-index: 1; width: 100%; display: flex; justify-content: center; padding: 6rem 1rem 6rem; }
.card {
  width: 61.75rem; max-width: 100%;
  padding: 3.2rem 3.7rem 4.5rem;
  border-radius: 1rem;
  background: rgba(255,255,255,.4);
  box-shadow: 0 .4rem 1.5rem rgba(0,0,0,.07);
  text-align: center;
}
.heading { margin: 0; font-size: 3rem; font-weight: 500; line-height: 1.3; color: #111; }
.instruction { margin: .2rem 0 3.2rem; font-size: 1.75rem; font-weight: 300; line-height: 1.4; color: #111; }

.field {
  display: block; width: 100%; height: 5rem;
  border-radius: 1.1rem;
  background: rgba(255,255,255,.5);
  box-shadow: inset .75rem 0 .5rem -.4rem rgba(0,0,0,.2);
  border: 2px solid transparent;
  transition: border-color .15s, background .15s;
}
.field:focus-within { border-color: var(--blue); background: rgba(255,255,255,.85); }
.field.invalid { border-color: var(--red); }
.field input {
  display: block; width: 100%; height: 100%;
  padding: 0 1.2rem;
  border: 0; outline: 0; background: transparent;
  text-align: center;
  font: 500 1.75rem var(--font);
  letter-spacing: .05rem;
  color: #000;
}
.field input::placeholder { color: #bab9b9; letter-spacing: 0; font-weight: 500; }

.btn-submit {
  margin-top: 3.2rem;
  display: inline-flex; align-items: center; justify-content: center; gap: .7rem;
  width: 18rem; height: 3.8rem;
  border: 0; border-radius: 999px;
  background: linear-gradient(90deg, #5036ba, #2a00d3);
  color: #fff;
  font: 700 1.75rem var(--font);
  box-shadow: .5rem .5rem .15rem rgba(0,0,0,.25);
  cursor: pointer;
  transition: transform .1s, box-shadow .1s;
}
.btn-submit svg { flex: none; width: 2rem; height: 2rem; }
.btn-submit:hover { transform: translate(.1rem,.1rem); box-shadow: .3rem .3rem .15rem rgba(0,0,0,.25); }
.btn-submit:disabled { opacity: .6; cursor: wait; }

.hints {
  width: max-content; max-width: 100%;
  margin: 2rem auto 0; padding: .8rem 1.6rem;
  list-style: none; text-align: left;
  background: rgba(255,255,255,.7);
  border-radius: 1rem;
  color: var(--red);
  font-size: 1.75rem; font-weight: 300; line-height: 1.45;
}
.hints li.ok { color: #0a8a2a; }

.error { min-height: 1.4em; margin: 1rem 0 0; color: var(--red); font-size: 1.4rem; font-weight: 700; }
.result { margin-top: 1rem; padding: 1rem 1.4rem; border-radius: 1rem; background: #eaf3ff; color: var(--navy); font-size: 1.4rem; text-align: left; }
[hidden] { display: none !important; }

/* ---------- มือถือ/แท็บเล็ต ---------- */
@media (max-width: 900px) {
  html { font-size: 11px; }
  .header { padding-top: 1.5rem; }
  .login-pill { position: static; margin: 0 auto 1.5rem; width: max-content; font-size: 1.8rem; }
  .title { font-size: 2.4rem; }
  .faculty { font-size: 1.8rem; }
  main { padding: 2rem .8rem 3rem; }
  .card { padding: 2.4rem 1.6rem 3rem; }
  .heading { font-size: 2.4rem; }
  .instruction { font-size: 1.5rem; margin-bottom: 2.2rem; }
  .field { height: 4.6rem; }
  .field input { font-size: 1.7rem; }
  .btn-submit { margin-top: 2.2rem; font-size: 1.7rem; }
  .hints { font-size: 1.5rem; }
}
  </style>
</head>
<body>

  <header class="header">
    <a class="login-pill" href="#studentId"><span class="logo" aria-hidden="true"></span>เข้าสู่ระบบ</a>
    <h1 class="title">ระบบติดตามสถานะการส่งเอกสาร <span>กยศ.</span></h1>
    <p class="faculty">- คณะวิทยาการสารสนเทศ -</p>
  </header>

  <main>
    <section class="card">
      <h2 class="heading">ตรวจสอบสถานะการส่งเอกสาร</h2>
      <p class="instruction">กรอกเลขประจำตัวประชาชน 13 หลัก เพื่อตรวจสอบสถานะล่าสุด</p>

      <form id="loginForm" novalidate>
        <label class="field" id="field">
          <input id="studentId" name="studentId" type="text" inputmode="numeric"
                 autocomplete="off" maxlength="13" spellcheck="false"
                 placeholder="เลขบัตรประชาชน หรือ รหัสนิสิต" aria-describedby="error" required />
        </label>

        <button class="btn-submit" id="submitBtn" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path>
          </svg>
          ตรวจสอบสถานะ
        </button>

        <ul class="hints">
          <li id="ruleStudent">*รหัสนิสิตต้องมีตัวเลข 11 ตัว</li>
          <li id="ruleCitizen">*เลขบัตรประชาชนต้องครบ 13 หลัก</li>
          <li id="ruleChars">*ห้ามมีเว้นวรรคและตัวอักษรพิเศษ</li>
        </ul>
        <p class="error" id="error" role="alert"></p>
      </form>

      <div class="result" id="result" hidden></div>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const input = document.getElementById('studentId');
    const field = document.getElementById('field');
    const errEl = document.getElementById('error');
    const result = document.getElementById('result');
    const btn = document.getElementById('submitBtn');
    const ruleStudent = document.getElementById('ruleStudent');
    const ruleCitizen = document.getElementById('ruleCitizen');
    const ruleChars = document.getElementById('ruleChars');

    // เหลือเฉพาะตัวเลข (รวมกรณีวางข้อความที่มีเว้นวรรค/ขีด)
    input.addEventListener('input', () => {
      const raw = input.value;
      const clean = raw.replace(/\D/g, '').slice(0, 13);
      input.value = clean;
      ruleStudent.classList.toggle('ok', clean.length === 11);
      ruleCitizen.classList.toggle('ok', clean.length === 13);
      ruleChars.classList.toggle('ok', clean.length > 0 && raw === clean);
      field.classList.remove('invalid');
      errEl.textContent = '';
    });

    function validate(v) {
      if (!v) return 'กรุณากรอกเลขบัตรประชาชน หรือ รหัสนิสิต';
      if (!/^\d+$/.test(v)) return 'ห้ามมีเว้นวรรคและตัวอักษรพิเศษ';
      if (v.length !== 11 && v.length !== 13) return 'รหัสนิสิตต้องมี 11 ตัว หรือเลขบัตรประชาชนต้องครบ 13 หลัก';
      return '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.hidden = true;
      const v = input.value.trim();
      const msg = validate(v);
      if (msg) { errEl.textContent = msg; field.classList.add('invalid'); input.focus(); return; }

      btn.disabled = true;
      try {
        // TODO: เปลี่ยนเป็น API จริง เช่น
        // const res = await fetch('/api/status?id=' + encodeURIComponent(v));
        // const data = await res.json();
        await new Promise(r => setTimeout(r, 600)); // จำลองการเรียก API
        result.textContent = 'รับข้อมูลแล้ว (ลงท้าย ' + v.slice(-4) + ') — ยังไม่ได้เชื่อมต่อระบบฐานข้อมูล';
        result.hidden = false;
      } catch (err) {
        errEl.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
